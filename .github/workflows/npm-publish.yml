# Tests the package, bumps the version to the release tag and publishes it to npm.
# Publishing uses npm trusted publishing (OIDC); no npm token is involved.

name: publish

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit -- --run

  version:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "svelte-final-form-ts+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release version $APP_VERSION" || true
          git push -u origin "HEAD:$DEFAULT_BRANCH"
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
